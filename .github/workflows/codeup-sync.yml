name: Codeup Nightly Sync

on:
  schedule:
    - cron: "23 19 * * *"
  workflow_run:
    workflows: [Codeup CI]
    types: [completed]
    branches: [sync/upstream-nightly]
  workflow_dispatch:
    inputs:
      dry_run:
        description: Discover the published Nightly without changing the sync branch
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: codeup-nightly-sync
  cancel-in-progress: false

jobs:
  sync:
    if: github.repository == 'U4F5Va6c/t3code' && (github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success')
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Require workflow-capable sync credential
        if: inputs.dry_run != true
        env:
          CODEUP_SYNC_TOKEN: ${{ secrets.CODEUP_SYNC_TOKEN }}
        run: |
          if [ -z "$CODEUP_SYNC_TOKEN" ]; then
            echo '::error::Configure CODEUP_SYNC_TOKEN with Contents, Workflows, Pull requests and Issues write access, plus Actions read access. See docs/operations/codeup-fork.md.'
            exit 1
          fi
      - uses: actions/checkout@v6
        with:
          ref: codeup-integration
          fetch-depth: 0
          token: ${{ secrets.CODEUP_SYNC_TOKEN || github.token }}
      - name: Set merge identity
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
      - name: Update one Nightly PR
        uses: actions/github-script@v8
        env:
          CODEUP_AUTO_MERGE: ${{ vars.CODEUP_AUTO_MERGE }}
          CODEUP_DRY_RUN: ${{ inputs.dry_run }}
        with:
          github-token: ${{ secrets.CODEUP_SYNC_TOKEN || github.token }}
          script: |
            const { sync } = require('./.github/scripts/codeup-sync.cjs');
            const result = await sync({ github, context, core,
              dryRun: process.env.CODEUP_DRY_RUN === 'true',
              autoMerge: process.env.CODEUP_AUTO_MERGE === 'true' });
            await core.summary.addCodeBlock(JSON.stringify(result, null, 2), 'json').write();
      - uses: actions/upload-artifact@v7
        if: failure()
        with:
          name: codeup-nightly-conflict-${{ github.run_id }}
          path: codeup-sync-conflict.patch
          if-no-files-found: ignore
