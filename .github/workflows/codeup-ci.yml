# Fork-only CI. Upstream workflows need blacksmith runners and release secrets,
# so they stay disabled here; see docs/operations/codeup-fork.md.
name: Codeup CI

on:
  pull_request:
    branches:
      - codeup-integration
  push:
    branches:
      - codeup-integration
  workflow_dispatch:
    inputs:
      release_candidate:
        description: Publish an unmerged acceptance build excluded from the update channel
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: codeup-ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  resolve:
    name: Resolve Codeup release
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.release.outputs.version }}
      sha: ${{ steps.release.outputs.sha }}
      build: ${{ steps.release.outputs.build }}
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0
          sparse-checkout: |
            /*
            !/.repos/
          sparse-checkout-cone-mode: false
      - name: Resolve published upstream baseline and build identity
        id: release
        uses: actions/github-script@v8
        with:
          script: |
            await require('./.github/scripts/codeup-release.cjs').resolve({ github, context, core });
      - uses: actions/upload-artifact@v7
        with:
          name: codeup-build-metadata
          path: codeup-build.json

  check:
    name: Lint, typecheck, source control tests
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          sparse-checkout: |
            /*
            !/.repos/
          sparse-checkout-cone-mode: false

      - name: Setup Vite+
        uses: voidzero-dev/setup-vp@v1
        with:
          node-version-file: package.json
          cache: true
          run-install: true

      - name: Ensure Electron runtime is installed
        run: vp run --filter @t3tools/desktop ensure:electron

      - name: Check unused code
        run: vp run knip:check

      - name: Check
        run: vp check

      - name: Typecheck
        run: vpr typecheck

      - name: Test source control packages
        run: >-
          vp run --parallel --concurrency-limit 4
          --filter '@t3tools/source-control-*' --filter @t3tools/contracts
          --filter @t3tools/shared --filter @t3tools/client-runtime test

      - name: Test Codeup integration boundaries
        run: >-
          vp test run
          apps/server/src/pullRequest/PullRequestService.test.ts
          apps/server/src/pullRequest/PullRequestReviewGuideService.test.ts
          apps/server/src/mcp/toolkits/pullRequests/handlers.test.ts
          apps/server/src/mcp/toolkits/core.test.ts
          apps/server/src/mcp/McpHttpServer.test.ts
          apps/server/src/auth/RpcAuthorization.test.ts
          apps/web/src/components/pullRequest/usePullRequestReviewDrafts.test.ts
          apps/web/src/lib/diffRendering.test.ts
          apps/web/src/components/pullRequest/pullRequestList.logic.test.ts
          apps/web/src/components/pullRequest/pullRequestDetail.logic.test.ts
          apps/web/src/components/pullRequest/pullRequestEditing.logic.test.ts
          apps/server/src/serverSettings.test.ts
          apps/server/src/sourceControl/SourceControlDiscovery.test.ts
          apps/server/src/sourceControl/SourceControlProviderRegistry.test.ts
          apps/server/src/sourceControl/SourceControlRepositoryService.test.ts
          apps/web/src/components/settings/ProviderSettingsForm.test.ts
          scripts/lib/brand-assets.test.ts
          scripts/resolve-nightly-release.test.ts
          scripts/build-desktop-artifact.test.ts
          apps/desktop/src/updates/updateChannels.test.ts
          apps/desktop/src/app/DesktopEnvironment.test.ts
          apps/web/src/branding.test.ts
          apps/server/src/cloud/bootService.test.ts
          apps/server/src/cloud/selfUpdate.test.ts
          apps/server/src/cloud/pinnedRuntime.test.ts
          apps/server/src/serviceLauncher.test.ts
          apps/server/src/cli/update.test.ts
          apps/desktop/src/updates/DesktopUpdates.test.ts
          apps/web/src/versionSkew.test.ts
          apps/web/src/state/releases.test.ts
          apps/web/src/components/desktopUpdate.logic.test.ts
          apps/web/src/components/sidebar/updateEverything.logic.test.ts
          apps/mobile/src/features/settings/environment-maintenance.test.ts
      - name: Test Fork sync and atomic release publication
        run: node --test .github/scripts/codeup-*.test.cjs

  macos-preview:
    name: Codeup macOS (${{ matrix.arch }})
    needs: resolve
    # PRs keep native installer coverage without packaging another full release.
    if: needs.resolve.outputs.build == 'true' || github.event_name == 'pull_request'
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: arm64
            runner: macos-15
          - arch: x64
            runner: macos-15-intel
    steps:
      - uses: actions/checkout@v6
        with:
          # Package the PR commit itself; the artifact and review use the same SHA.
          ref: ${{ needs.resolve.outputs.sha }}
          sparse-checkout: |
            /*
            !/.repos/
          sparse-checkout-cone-mode: false
      - uses: voidzero-dev/setup-vp@v1
        with:
          node-version-file: package.json
          # Restoring/saving the full workspace store costs minutes on Intel runners.
          cache: false
          run-install: false
      - name: Install desktop build dependencies
        run: vp install --frozen-lockfile --filter=t3... --filter=@t3tools/web... --filter=@t3tools/desktop... --filter=@t3tools/scripts...
      - name: Install Electron
        run: vp run --filter @t3tools/desktop ensure:electron
      - name: Verify Fork native installer
        run: vp test run apps/desktop/src/electron/CodeupMacInstaller.test.ts apps/desktop/src/electron/ElectronUpdater.test.ts
      - name: Resolve shared Codeup version
        if: needs.resolve.outputs.build == 'true'
        env:
          CODEUP_VERSION: ${{ needs.resolve.outputs.version }}
        run: |
          echo "CODEUP_VERSION=$CODEUP_VERSION" >> "$GITHUB_ENV"
          node scripts/update-release-package-versions.ts "$CODEUP_VERSION"
      - name: Build isolated acceptance app
        if: needs.resolve.outputs.build == 'true'
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: "false"
          # The preview explicitly uses identity "-" (ad-hoc), without signing credentials.
          CSC_FOR_PULL_REQUEST: "true"
          T3CODE_DESKTOP_UPDATE_REPOSITORY: U4F5Va6c/t3code
          T3CODE_CODEUP_RELEASE: ${{ github.ref == 'refs/heads/codeup-integration' || inputs.release_candidate == true }}
        run: |
          vp run dist:desktop:artifact --platform mac --target dmg --arch '${{ matrix.arch }}' --build-version "$CODEUP_VERSION" --output-dir artifacts --verbose
          shasum -a 256 artifacts/*.dmg > artifacts/SHA256SUMS.txt
          git rev-parse HEAD > artifacts/COMMIT.txt
      - name: Verify app inside DMG
        if: needs.resolve.outputs.build == 'true'
        run: |
          preview_dmgs=(artifacts/*.dmg)
          test "${#preview_dmgs[@]}" -eq 1
          hdiutil verify "${preview_dmgs[0]}"
          preview_mount="$(mktemp -d "$RUNNER_TEMP/codeup-dmg.XXXXXX")"
          hdiutil attach "${preview_dmgs[0]}" -readonly -nobrowse -mountpoint "$preview_mount"
          trap 'hdiutil detach "$preview_mount"' EXIT
          preview_app="$preview_mount/T3 Code (Codeup Preview).app"
          preview_report="artifacts/SIGNATURE-${{ matrix.arch }}.txt"
          codesign --display --verbose=4 "$preview_app" 2>&1 | tee "$preview_report"
          grep -q '^Signature=adhoc$' "$preview_report"
          codesign --verify --deep --strict --verbose=2 "$preview_app" 2>&1 | tee -a "$preview_report"
          test "$(/usr/libexec/PlistBuddy -c 'Print CFBundleIdentifier' "$preview_app/Contents/Info.plist")" = 'io.github.u4f5va6c.t3code.codeup-preview'
          ELECTRON_RUN_AS_NODE=1 "$preview_app/Contents/MacOS/T3 Code (Codeup Preview)" -e 'if (!process.versions.electron) process.exit(1); console.log(`Packaged Electron ${process.versions.electron} (${process.arch}) started`)' | tee -a "$preview_report"
      - name: Build Mac standalone backend
        if: needs.resolve.outputs.build == 'true' && matrix.arch == 'arm64'
        env:
          VP_NODE_VERSION: "26.8.2"
        run: |
          node apps/server/scripts/cli.ts build-exe --verbose
          mkdir -p "$RUNNER_TEMP/cli-resource-monitor/darwin-arm64"
          cp native/resource-monitor/target/aarch64-apple-darwin/release/t3-resource-monitor "$RUNNER_TEMP/cli-resource-monitor/darwin-arm64/"
          node scripts/build-cli-archive.ts --platform mac --arch arm64 --version "$CODEUP_VERSION" --resource-monitor-dir "$RUNNER_TEMP/cli-resource-monitor" --output-dir release-cli
          node scripts/smoke-cli-archive.ts --archive release-cli/*.tar.gz --expect-version "$CODEUP_VERSION"
          shasum -a 256 release-cli/*.tar.gz > release-cli/SHA256SUMS.txt
          git rev-parse HEAD > release-cli/COMMIT.txt
      - name: Upload Mac standalone backend
        if: needs.resolve.outputs.build == 'true' && matrix.arch == 'arm64'
        uses: actions/upload-artifact@v7
        with:
          name: codeup-preview-cli-darwin-arm64-${{ needs.resolve.outputs.sha }}
          path: release-cli/
          if-no-files-found: error
          retention-days: 30
          compression-level: 0
      - name: Upload DMG and checksum
        if: needs.resolve.outputs.build == 'true'
        uses: actions/upload-artifact@v7
        with:
          name: codeup-preview-macos-${{ matrix.arch }}-${{ needs.resolve.outputs.sha }}
          path: |
            artifacts/*.dmg
            artifacts/*.zip
            artifacts/*.blockmap
            artifacts/codeup-mac.yml
            artifacts/SHA256SUMS.txt
            artifacts/COMMIT.txt
            artifacts/SIGNATURE-*.txt
          if-no-files-found: error
          retention-days: 30
          compression-level: 0

  linux-backend:
    name: Codeup Preview backend (Linux x64)
    needs: resolve
    if: needs.resolve.outputs.build == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ needs.resolve.outputs.sha }}
          sparse-checkout: |
            /*
            !/.repos/
          sparse-checkout-cone-mode: false
      - uses: voidzero-dev/setup-vp@v1
        with:
          node-version-file: package.json
          cache: false
          run-install: false
      - name: Install backend build dependencies
        run: vp install --frozen-lockfile --filter=t3... --filter=@t3tools/scripts...
      - name: Resolve shared Codeup version
        env:
          CODEUP_VERSION: ${{ needs.resolve.outputs.version }}
        run: |
          echo "CODEUP_VERSION=$CODEUP_VERSION" >> "$GITHUB_ENV"
          node scripts/update-release-package-versions.ts "$CODEUP_VERSION"
      - name: Build Web and resource monitor
        run: |
          vp run --filter @t3tools/web build
          mkdir -p apps/server/dist/client
          cp -R apps/web/dist/. apps/server/dist/client/
          node scripts/apply-web-brand-assets.ts nightly apps/server/dist/client
          cargo build --locked --release --manifest-path native/resource-monitor/Cargo.toml
          mkdir -p "$RUNNER_TEMP/cli-resource-monitor/linux-x64"
          cp native/resource-monitor/target/release/t3-resource-monitor "$RUNNER_TEMP/cli-resource-monitor/linux-x64/"
      - name: Build and verify standalone backend
        env:
          VP_NODE_VERSION: "26.8.2"
        run: |
          node apps/server/scripts/cli.ts build-exe --verbose
          node scripts/build-cli-archive.ts --platform linux --arch x64 --version "$CODEUP_VERSION" --resource-monitor-dir "$RUNNER_TEMP/cli-resource-monitor" --output-dir release-cli
          node scripts/smoke-cli-archive.ts --archive release-cli/*.tar.gz --expect-version "$CODEUP_VERSION"
          sha256sum release-cli/*.tar.gz > release-cli/SHA256SUMS.txt
          git rev-parse HEAD > release-cli/COMMIT.txt
      - name: Upload Linux standalone backend
        uses: actions/upload-artifact@v7
        with:
          name: codeup-preview-cli-linux-x64-${{ needs.resolve.outputs.sha }}
          path: release-cli/
          if-no-files-found: error
          retention-days: 30
          compression-level: 0

  publish:
    name: Publish complete Codeup release
    needs: [resolve, check, macos-preview, linux-backend]
    if: github.repository == 'U4F5Va6c/t3code' && (github.ref == 'refs/heads/codeup-integration' || inputs.release_candidate == true)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ needs.resolve.outputs.sha }}
          sparse-checkout: |
            .github/scripts
            scripts/lib
      - uses: actions/download-artifact@v8
        with:
          path: release-input
      - name: Verify, assemble, and publish atomically
        uses: actions/github-script@v8
        env:
          CODEUP_CANDIDATE: ${{ inputs.release_candidate == true && github.ref != 'refs/heads/codeup-integration' }}
        with:
          script: |
            const fs = require('node:fs/promises');
            const { assemble, publish } = require('./.github/scripts/codeup-release.cjs');
            const metadata = JSON.parse(await fs.readFile('release-input/codeup-build-metadata/codeup-build.json', 'utf8'));
            await assemble('release-input', 'release-output', metadata);
            const url = await publish({ github, directory: 'release-output', metadata, candidate: process.env.CODEUP_CANDIDATE === 'true' });
            await core.summary.addLink('Complete Codeup release', url).write();
