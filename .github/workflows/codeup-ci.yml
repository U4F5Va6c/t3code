# Fork-only CI. Upstream workflows need blacksmith runners and release secrets,
# so they stay disabled here; see docs/operations/codeup-fork.md.
name: Codeup CI

on:
  pull_request:
    branches:
      - codeup-integration
  push:
    branches:
      - codeup-integration

permissions:
  contents: read

concurrency:
  group: codeup-ci-${{ github.event.pull_request.number || github.sha }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  check:
    name: Lint, typecheck, source control tests
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          sparse-checkout: |
            /*
            !/.repos/
          sparse-checkout-cone-mode: false

      - name: Setup Vite+
        uses: voidzero-dev/setup-vp@v1
        with:
          node-version-file: package.json
          cache: true
          run-install: true

      - name: Ensure Electron runtime is installed
        run: vp run --filter @t3tools/desktop ensure:electron

      - name: Check unused code
        run: vp run knip:check

      - name: Check
        run: vp check

      - name: Typecheck
        run: vpr typecheck

      - name: Test source control packages
        run: >-
          vp run --parallel --concurrency-limit 4
          --filter '@t3tools/source-control-*' --filter @t3tools/contracts
          --filter @t3tools/shared --filter @t3tools/client-runtime test

      - name: Test Codeup integration boundaries
        run: >-
          vp test run
          apps/server/src/pullRequest/PullRequestService.test.ts
          apps/web/src/components/pullRequest/pullRequestList.logic.test.ts
          apps/web/src/components/pullRequest/pullRequestDetail.logic.test.ts
          apps/web/src/components/pullRequest/pullRequestEditing.logic.test.ts
          apps/server/src/serverSettings.test.ts
          apps/server/src/sourceControl/SourceControlDiscovery.test.ts
          apps/server/src/sourceControl/SourceControlProviderRegistry.test.ts
          apps/server/src/sourceControl/SourceControlRepositoryService.test.ts
          apps/web/src/components/settings/ProviderSettingsForm.test.ts

  macos-preview:
    name: Codeup Preview DMG (${{ matrix.arch }})
    if: github.event_name == 'pull_request'
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: arm64
            runner: macos-15
          - arch: x64
            runner: macos-15-intel
    steps:
      - uses: actions/checkout@v6
        with:
          # Package the PR commit itself; the artifact and review use the same SHA.
          ref: ${{ github.event.pull_request.head.sha }}
          sparse-checkout: |
            /*
            !/.repos/
          sparse-checkout-cone-mode: false
      - uses: voidzero-dev/setup-vp@v1
        with:
          node-version-file: package.json
          # Restoring/saving the full workspace store costs minutes on Intel runners.
          cache: false
          run-install: false
      - name: Install desktop build dependencies
        run: vp install --frozen-lockfile --filter=t3... --filter=@t3tools/web... --filter=@t3tools/desktop... --filter=@t3tools/scripts...
      - name: Install Electron
        run: vp run --filter @t3tools/desktop ensure:electron
      - name: Build isolated acceptance app
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: "false"
          # The preview explicitly uses identity "-" (ad-hoc), without signing credentials.
          CSC_FOR_PULL_REQUEST: "true"
          T3CODE_DESKTOP_UPDATE_REPOSITORY: U4F5Va6c/t3code
        run: |
          version="0.0.0-codeup.$(date -u +%Y%m%d).${GITHUB_RUN_NUMBER}"
          vp run dist:desktop:artifact --platform mac --target dmg --arch '${{ matrix.arch }}' --build-version "$version" --output-dir artifacts --verbose
          shasum -a 256 artifacts/*.dmg > artifacts/SHA256SUMS.txt
          git rev-parse HEAD > artifacts/COMMIT.txt
      - name: Verify app inside DMG
        run: |
          preview_dmgs=(artifacts/*.dmg)
          test "${#preview_dmgs[@]}" -eq 1
          hdiutil verify "${preview_dmgs[0]}"
          preview_mount="$(mktemp -d "$RUNNER_TEMP/codeup-dmg.XXXXXX")"
          hdiutil attach "${preview_dmgs[0]}" -readonly -nobrowse -mountpoint "$preview_mount"
          trap 'hdiutil detach "$preview_mount"' EXIT
          preview_app="$preview_mount/T3 Code (Codeup Preview).app"
          preview_report="artifacts/SIGNATURE-${{ matrix.arch }}.txt"
          codesign --display --verbose=4 "$preview_app" 2>&1 | tee "$preview_report"
          grep -q '^Signature=adhoc$' "$preview_report"
          codesign --verify --deep --strict --verbose=2 "$preview_app" 2>&1 | tee -a "$preview_report"
          test "$(/usr/libexec/PlistBuddy -c 'Print CFBundleIdentifier' "$preview_app/Contents/Info.plist")" = 'io.github.u4f5va6c.t3code.codeup-preview'
          ELECTRON_RUN_AS_NODE=1 "$preview_app/Contents/MacOS/T3 Code (Codeup Preview)" -e 'if (!process.versions.electron) process.exit(1); console.log(`Packaged Electron ${process.versions.electron} (${process.arch}) started`)' | tee -a "$preview_report"
      - name: Upload DMG and checksum
        uses: actions/upload-artifact@v7
        with:
          name: codeup-preview-macos-${{ matrix.arch }}-${{ github.event.pull_request.head.sha }}
          path: |
            artifacts/*.dmg
            artifacts/SHA256SUMS.txt
            artifacts/COMMIT.txt
            artifacts/SIGNATURE-*.txt
          if-no-files-found: error
          retention-days: 30
          compression-level: 0
