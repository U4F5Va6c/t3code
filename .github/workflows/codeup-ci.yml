# Fork-only CI. Upstream workflows need blacksmith runners and release secrets,
# so they stay disabled here; see docs/operations/codeup-fork.md.
name: Codeup CI

on:
  pull_request:
    branches:
      - codeup-integration
  push:
    branches:
      - codeup-integration

permissions:
  contents: read

concurrency:
  group: codeup-ci-${{ github.event.pull_request.number || github.sha }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  check:
    name: Lint, typecheck, source control tests
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          sparse-checkout: |
            /*
            !/.repos/
          sparse-checkout-cone-mode: false

      - name: Setup Vite+
        uses: voidzero-dev/setup-vp@v1
        with:
          node-version-file: package.json
          cache: true
          run-install: true

      - name: Ensure Electron runtime is installed
        run: vp run --filter @t3tools/desktop ensure:electron

      - name: Check unused code
        run: vp run knip:check

      - name: Check
        run: vp check

      - name: Typecheck
        run: vpr typecheck

      - name: Test source control packages
        run: >-
          vp run --parallel --concurrency-limit 4
          --filter '@t3tools/source-control-*' --filter @t3tools/contracts
          --filter @t3tools/shared --filter @t3tools/client-runtime test

      - name: Test Codeup integration boundaries
        run: >-
          vp test run
          apps/server/src/pullRequest/PullRequestService.test.ts
          apps/web/src/components/pullRequest/pullRequestList.logic.test.ts
          apps/web/src/components/pullRequest/pullRequestDetail.logic.test.ts
          apps/web/src/components/pullRequest/pullRequestEditing.logic.test.ts
          apps/server/src/serverSettings.test.ts
          apps/server/src/sourceControl/SourceControlDiscovery.test.ts
          apps/server/src/sourceControl/SourceControlProviderRegistry.test.ts
          apps/server/src/sourceControl/SourceControlRepositoryService.test.ts
          apps/web/src/components/settings/ProviderSettingsForm.test.ts
          scripts/lib/brand-assets.test.ts
          scripts/resolve-nightly-release.test.ts
          scripts/build-desktop-artifact.test.ts
          apps/desktop/src/updates/updateChannels.test.ts
          apps/desktop/src/app/DesktopEnvironment.test.ts
          apps/web/src/branding.test.ts

  macos-preview:
    name: Codeup Preview DMG (${{ matrix.arch }})
    if: github.event_name == 'pull_request'
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: arm64
            runner: macos-15
          - arch: x64
            runner: macos-15-intel
    steps:
      - uses: actions/checkout@v6
        with:
          # Package the PR commit itself; the artifact and review use the same SHA.
          ref: ${{ github.event.pull_request.head.sha }}
          sparse-checkout: |
            /*
            !/.repos/
          sparse-checkout-cone-mode: false
      - uses: voidzero-dev/setup-vp@v1
        with:
          node-version-file: package.json
          # Restoring/saving the full workspace store costs minutes on Intel runners.
          cache: false
          run-install: false
      - name: Install desktop build dependencies
        run: vp install --frozen-lockfile --filter=t3... --filter=@t3tools/web... --filter=@t3tools/desktop... --filter=@t3tools/scripts...
      - name: Install Electron
        run: vp run --filter @t3tools/desktop ensure:electron
      - name: Resolve shared Codeup version
        run: |
          node scripts/resolve-nightly-release.ts --date "$(git show -s --format=%cs HEAD | tr -d '-')" --run-number "$GITHUB_RUN_NUMBER" --sha "$(git rev-parse HEAD)" --channel codeup > "$RUNNER_TEMP/codeup-version"
          version="$(sed -n 's/^version=//p' "$RUNNER_TEMP/codeup-version")"
          test -n "$version"
          echo "CODEUP_VERSION=$version" >> "$GITHUB_ENV"
          node scripts/update-release-package-versions.ts "$version"
      - name: Build isolated acceptance app
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: "false"
          # The preview explicitly uses identity "-" (ad-hoc), without signing credentials.
          CSC_FOR_PULL_REQUEST: "true"
          T3CODE_DESKTOP_UPDATE_REPOSITORY: U4F5Va6c/t3code
        run: |
          vp run dist:desktop:artifact --platform mac --target dmg --arch '${{ matrix.arch }}' --build-version "$CODEUP_VERSION" --output-dir artifacts --verbose
          shasum -a 256 artifacts/*.dmg > artifacts/SHA256SUMS.txt
          git rev-parse HEAD > artifacts/COMMIT.txt
      - name: Verify app inside DMG
        run: |
          preview_dmgs=(artifacts/*.dmg)
          test "${#preview_dmgs[@]}" -eq 1
          hdiutil verify "${preview_dmgs[0]}"
          preview_mount="$(mktemp -d "$RUNNER_TEMP/codeup-dmg.XXXXXX")"
          hdiutil attach "${preview_dmgs[0]}" -readonly -nobrowse -mountpoint "$preview_mount"
          trap 'hdiutil detach "$preview_mount"' EXIT
          preview_app="$preview_mount/T3 Code (Codeup Preview).app"
          preview_report="artifacts/SIGNATURE-${{ matrix.arch }}.txt"
          codesign --display --verbose=4 "$preview_app" 2>&1 | tee "$preview_report"
          grep -q '^Signature=adhoc$' "$preview_report"
          codesign --verify --deep --strict --verbose=2 "$preview_app" 2>&1 | tee -a "$preview_report"
          test "$(/usr/libexec/PlistBuddy -c 'Print CFBundleIdentifier' "$preview_app/Contents/Info.plist")" = 'io.github.u4f5va6c.t3code.codeup-preview'
          ELECTRON_RUN_AS_NODE=1 "$preview_app/Contents/MacOS/T3 Code (Codeup Preview)" -e 'if (!process.versions.electron) process.exit(1); console.log(`Packaged Electron ${process.versions.electron} (${process.arch}) started`)' | tee -a "$preview_report"
      - name: Build Mac standalone backend
        if: matrix.arch == 'arm64'
        env:
          VP_NODE_VERSION: "26.8.2"
        run: |
          node apps/server/scripts/cli.ts build-exe --verbose
          mkdir -p "$RUNNER_TEMP/cli-resource-monitor/darwin-arm64"
          cp native/resource-monitor/target/aarch64-apple-darwin/release/t3-resource-monitor "$RUNNER_TEMP/cli-resource-monitor/darwin-arm64/"
          node scripts/build-cli-archive.ts --platform mac --arch arm64 --version "$CODEUP_VERSION" --resource-monitor-dir "$RUNNER_TEMP/cli-resource-monitor" --output-dir release-cli
          node scripts/smoke-cli-archive.ts --archive release-cli/*.tar.gz --expect-version "$CODEUP_VERSION"
          shasum -a 256 release-cli/*.tar.gz > release-cli/SHA256SUMS.txt
          git rev-parse HEAD > release-cli/COMMIT.txt
      - name: Upload Mac standalone backend
        if: matrix.arch == 'arm64'
        uses: actions/upload-artifact@v7
        with:
          name: codeup-preview-cli-darwin-arm64-${{ github.event.pull_request.head.sha }}
          path: release-cli/
          if-no-files-found: error
          retention-days: 30
          compression-level: 0
      - name: Upload DMG and checksum
        uses: actions/upload-artifact@v7
        with:
          name: codeup-preview-macos-${{ matrix.arch }}-${{ github.event.pull_request.head.sha }}
          path: |
            artifacts/*.dmg
            artifacts/SHA256SUMS.txt
            artifacts/COMMIT.txt
            artifacts/SIGNATURE-*.txt
          if-no-files-found: error
          retention-days: 30
          compression-level: 0

  linux-backend:
    name: Codeup Preview backend (Linux x64)
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          sparse-checkout: |
            /*
            !/.repos/
          sparse-checkout-cone-mode: false
      - uses: voidzero-dev/setup-vp@v1
        with:
          node-version-file: package.json
          cache: false
          run-install: false
      - name: Install backend build dependencies
        run: vp install --frozen-lockfile --filter=t3... --filter=@t3tools/scripts...
      - name: Resolve shared Codeup version
        run: |
          node scripts/resolve-nightly-release.ts --date "$(git show -s --format=%cs HEAD | tr -d '-')" --run-number "$GITHUB_RUN_NUMBER" --sha "$(git rev-parse HEAD)" --channel codeup > "$RUNNER_TEMP/codeup-version"
          version="$(sed -n 's/^version=//p' "$RUNNER_TEMP/codeup-version")"
          test -n "$version"
          echo "CODEUP_VERSION=$version" >> "$GITHUB_ENV"
          node scripts/update-release-package-versions.ts "$version"
      - name: Build Web and resource monitor
        run: |
          vp run --filter @t3tools/web build
          mkdir -p apps/server/dist/client
          cp -R apps/web/dist/. apps/server/dist/client/
          node scripts/apply-web-brand-assets.ts nightly apps/server/dist/client
          cargo build --locked --release --manifest-path native/resource-monitor/Cargo.toml
          mkdir -p "$RUNNER_TEMP/cli-resource-monitor/linux-x64"
          cp native/resource-monitor/target/release/t3-resource-monitor "$RUNNER_TEMP/cli-resource-monitor/linux-x64/"
      - name: Build and verify standalone backend
        env:
          VP_NODE_VERSION: "26.8.2"
        run: |
          node apps/server/scripts/cli.ts build-exe --verbose
          node scripts/build-cli-archive.ts --platform linux --arch x64 --version "$CODEUP_VERSION" --resource-monitor-dir "$RUNNER_TEMP/cli-resource-monitor" --output-dir release-cli
          node scripts/smoke-cli-archive.ts --archive release-cli/*.tar.gz --expect-version "$CODEUP_VERSION"
          sha256sum release-cli/*.tar.gz > release-cli/SHA256SUMS.txt
          git rev-parse HEAD > release-cli/COMMIT.txt
      - name: Upload Linux standalone backend
        uses: actions/upload-artifact@v7
        with:
          name: codeup-preview-cli-linux-x64-${{ github.event.pull_request.head.sha }}
          path: release-cli/
          if-no-files-found: error
          retention-days: 30
          compression-level: 0
